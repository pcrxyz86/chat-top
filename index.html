<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Top — Comunicação em Tempo Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    :root {
      --theme-primary: #4F46E5;
      --theme-secondary: #0284C7;
      --theme-accent: #0284C7;
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --bubble-received-start: rgba(255,255,255,0.95);
      --bubble-received-end: rgba(248,250,252,0.9);
      --bubble-received-text: #0f172a;
    }
    body.dark {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
      --bubble-received-start: rgba(51,65,85,0.9);
      --bubble-received-end: rgba(30,41,59,0.8);
      --bubble-received-text: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body { background-color: var(--bg-main); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow-x: hidden; transition: background-color .3s, color .3s; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.5); border-radius: 9999px; }
    .bubble-sent {
      border-radius: 20px 20px 4px 20px;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
      color: #fff;
      box-shadow: 0 4px 12px -4px rgba(79,70,229,.3);
    }
    .bubble-received {
      border-radius: 20px 20px 20px 4px;
      background: linear-gradient(145deg, var(--bubble-received-start), var(--bubble-received-end));
      color: var(--bubble-received-text);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px -4px rgba(0,0,0,.1);
    }
    .theme-gradient-bg {
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
      color: #fff;
    }
    .bg-grid { background-color: var(--bg-main); background-image: radial-gradient(rgba(100,116,139,.16) 1px, transparent 1px); background-size: 24px 24px; }
    .dark .bg-white { background-color: var(--bg-card) !important; }
    .dark .bg-white\/80, .dark .bg-white\/90 { background-color: rgba(30,41,59,.9) !important; }
    .dark .border-slate-200 { border-color: var(--border-color) !important; }
    .dark .text-slate-900, .dark .text-slate-800 { color: var(--text-primary) !important; }
    .dark .text-slate-500, .dark .text-slate-600 { color: var(--text-secondary) !important; }
    .dark .bg-slate-100, .dark .bg-slate-50 { background-color: var(--bg-slate-100, #1e293b) !important; }
    .dark input { background-color: var(--bg-card) !important; color: var(--text-primary) !important; border-color: var(--border-color) !important; }
    @keyframes pop { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .msg-anim { animation: pop .2s ease-out; }
    .msg-delete-btn { opacity: 0; transition: opacity .15s; cursor: pointer; }
    .msg-wrapper:hover .msg-delete-btn { opacity: 1; }
    @media (hover: none) { .msg-delete-btn { opacity: .7; } }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900 transition-colors duration-300">

  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4"></div>

  <!-- TELA AUTH -->
  <main id="auth-screen" class="flex-1 flex items-center justify-center p-4 bg-grid relative overflow-y-auto">
    <div class="w-full max-w-md bg-white/90 backdrop-blur-xl border border-slate-200 rounded-3xl shadow-xl overflow-hidden relative my-4" style="background: var(--bg-card); border-color: var(--border-color);">
      <div class="px-6 pt-7 pb-5 text-center border-b border-slate-200" style="border-color: var(--border-color);">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl theme-gradient-bg mb-3">
          <i data-lucide="message-square-dashed" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-bold" style="color: var(--text-primary);">Chat <span style="color: var(--theme-accent);">Top</span></h1>
        <p class="text-xs text-slate-500 mt-1" style="color: var(--text-secondary);">Conecte-se em tempo real</p>
      </div>

      <div class="px-6 pt-5">
        <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-2xl border border-slate-200" style="background: var(--bg-slate-100, #f1f5f9); border-color: var(--border-color);">
          <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="py-2.5 text-sm font-semibold rounded-xl transition-all theme-gradient-bg shadow-sm">Entrar</button>
          <button type="button" id="tab-register" onclick="switchAuthTab('register')" class="py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-500">Criar Conta</button>
        </div>
      </div>

      <form id="auth-form" class="p-6 space-y-4" novalidate>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5" style="color: var(--text-secondary);">Nome de Usuário</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none"><i data-lucide="user" class="w-4 h-4"></i></span>
            <input type="text" id="username" required placeholder="Ex: LucasSilva"
              class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5" style="color: var(--text-secondary);">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none"><i data-lucide="lock" class="w-4 h-4"></i></span>
            <input type="password" id="password" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5" style="color: var(--text-secondary);">Idade (13+)</label>
            <input type="number" id="age" min="13" max="120" required placeholder="Ex: 24"
              class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5" style="color: var(--text-secondary);">Gênero</label>
            <select id="gender" required class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-sky-500 cursor-pointer">
              <option value="" disabled selected>Selecione...</option>
              <option value="Masculino">Masculino</option>
              <option value="Feminino">Feminino</option>
              <option value="Não-binário">Não-binário</option>
              <option value="Outro">Outro</option>
              <option value="Prefiro não informar">Prefiro não informar</option>
            </select>
          </div>
        </div>
        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200" style="background: var(--bg-slate-50, #f8fafc); border-color: var(--border-color);">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold" style="color: var(--text-primary);">Verificação Humana</span>
            <button type="button" id="refresh-captcha" class="text-xs text-slate-600 hover:text-slate-900 px-2 py-1 rounded-lg border border-slate-200 bg-white" style="background: var(--bg-card); border-color: var(--border-color);">
              <i data-lucide="refresh-cw" class="w-3 h-3 inline"></i> Novo
            </button>
          </div>
          <div class="flex items-center gap-3">
            <div id="captcha-question" class="flex-1 py-2 px-3 rounded-xl bg-white border border-slate-200 text-center font-bold text-sm" style="background: var(--bg-card); border-color: var(--border-color); color: var(--text-primary);">Quanto é 8 + 5?</div>
            <input type="number" id="captcha-answer" required placeholder="Resp."
              class="w-24 px-3 py-2 bg-white border border-slate-200 rounded-xl text-center font-semibold text-sm focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
        <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-2xl font-semibold text-sm theme-gradient-bg active:scale-[0.99] transition-all flex items-center justify-center gap-2">
          <span id="auth-submit-text">Entrar no Chat</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </main>

  <!-- TELA CHAT -->
  <div id="chat-screen" class="hidden h-screen w-full overflow-hidden flex relative" style="background: var(--bg-main);">
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/30 z-30 hidden lg:hidden"></div>

    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 bg-white/90 backdrop-blur-xl border-r border-slate-200 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 shadow-lg lg:shadow-none" style="background: var(--bg-card); border-color: var(--border-color);">
      <div class="h-16 px-5 flex items-center justify-between border-b border-slate-200 shrink-0" style="border-color: var(--border-color);">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl theme-gradient-bg flex items-center justify-center">
            <i data-lucide="message-square-dashed" class="w-5 h-5"></i>
          </div>
          <span class="font-bold" style="color: var(--text-primary);">Chat <span style="color: var(--theme-accent);">Top</span></span>
        </div>
        <button type="button" onclick="toggleSidebar(false)" class="lg:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-3 border-b border-slate-200" style="border-color: var(--border-color);">
        <div class="flex items-center gap-2.5 p-2 rounded-xl bg-slate-50 border border-slate-200" style="background: var(--bg-slate-50, #f8fafc); border-color: var(--border-color);">
          <div class="w-10 h-10 rounded-xl theme-gradient-bg flex items-center justify-center font-bold text-sm" id="user-avatar">US</div>
          <div class="min-w-0 flex-1">
            <p id="profile-username" class="text-sm font-semibold truncate" style="color: var(--text-primary);">Usuário</p>
            <p id="profile-info" class="text-[10px] truncate" style="color: var(--text-secondary);">20 anos</p>
          </div>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-4">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2">Salas</span>
          <nav id="channels-list" class="space-y-1 mt-2"></nav>
        </div>
        <div>
          <div class="flex items-center justify-between px-2 mb-2">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Online</span>
            <span class="text-[10px] text-emerald-600 font-semibold" id="online-count-sidebar">0</span>
          </div>
          <ul id="online-users-list" class="space-y-1"></ul>
        </div>
      </div>

      <div class="p-3 border-t border-slate-200" style="border-color: var(--border-color);">
        <button type="button" onclick="toggleDarkMode()" class="w-full py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center justify-center gap-2 mb-2" style="background: var(--bg-slate-100, #f1f5f9); color: var(--text-secondary);">
          <i data-lucide="moon" class="w-4 h-4 dark-icon"></i> Modo Escuro
        </button>
        <button type="button" onclick="logout()" class="w-full py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold flex items-center justify-center gap-2 border border-red-200">
          <i data-lucide="log-out" class="w-4 h-4"></i> Sair
        </button>
      </div>
    </aside>

    <section class="flex-1 flex flex-col min-w-0 bg-grid relative overflow-hidden">
      <header class="h-16 px-4 bg-white/90 backdrop-blur-xl border-b border-slate-200 flex items-center justify-between shrink-0 z-20" style="background: var(--bg-card); border-color: var(--border-color);">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" onclick="toggleSidebar(true)" class="lg:hidden p-2 rounded-xl bg-white border border-slate-200" style="background: var(--bg-card); border-color: var(--border-color);">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-center" style="color: var(--theme-accent); background: var(--bg-slate-50, #f8fafc); border-color: var(--border-color);">
            <i id="current-channel-icon" data-lucide="hash" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <h2 id="current-channel-name" class="text-base font-bold truncate" style="color: var(--text-primary);">Geral</h2>
            <p id="current-channel-desc" class="text-xs truncate" style="color: var(--text-secondary);">Conversa aberta</p>
          </div>
        </div>
        <button type="button" onclick="logout()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 text-xs font-semibold flex items-center gap-1.5" style="background: var(--bg-slate-100, #f1f5f9); color: var(--text-secondary);">
          <i data-lucide="log-out" class="w-4 h-4"></i> Sair
        </button>
      </header>

      <div id="messages-container" class="flex-1 overflow-y-auto px-4 py-5 space-y-4 z-10"></div>

      <footer class="p-3 bg-white/90 backdrop-blur-xl border-t border-slate-200 shrink-0 z-10" style="background: var(--bg-card); border-color: var(--border-color);">
        <form id="message-form" class="max-w-4xl mx-auto flex items-center gap-2">
          <input type="text" id="message-input" autocomplete="off" placeholder="Digite sua mensagem..."
            class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20" style="background: var(--bg-card); border-color: var(--border-color); color: var(--text-primary);" />
          <button type="submit" class="px-4 py-3 rounded-2xl theme-gradient-bg font-semibold text-sm flex items-center gap-1.5 active:scale-95 transition-all">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </footer>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, deleteDoc, query, orderBy, limit, onSnapshot, serverTimestamp, getDocs, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtGsSaqRHULKfzhkQU3UafoDSUP9wQ68",
      authDomain: "chat-top-120a2.firebaseapp.com",
      projectId: "chat-top-120a2",
      storageBucket: "chat-top-120a2.firebasestorage.app",
      messagingSenderId: "156258575236",
      appId: "1:156258575236:web:f8e784896101d8c223b3d1"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    lucide.createIcons();

    const CHANNELS = [
      { id:'geral', name:'Geral', icon:'hash', desc:'Conversa aberta para todos' },
      { id:'tecnologia', name:'Tecnologia', icon:'cpu', desc:'Programação, IA e hardware' },
      { id:'musica-jogos', name:'Música & Jogos', icon:'gamepad-2', desc:'Playlists, games e e-sports' },
      { id:'bate-papo', name:'Bate-papo Livre', icon:'coffee', desc:'Descontração e ideias do dia' }
    ];

    let currentUser = null;
    let currentAuthMode = 'login';
    let currentCaptchaResult = 0;
    let activeChannelId = 'geral';
    let unsubscribeMessages = null;
    let unsubscribePresence = null;
    let presenceHeartbeat = null;
    let isDarkMode = localStorage.getItem('chattop_dark') === 'true';
    let onlineCache = [];

    // ===== HELPERS =====
    function showToast(msg, type='info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      const styles = { error:'border-red-300 text-red-700', success:'border-emerald-300 text-emerald-700', info:'border-sky-300 text-slate-700' };
      const icons = { error:'alert-circle', success:'check-circle-2', info:'info' };
      t.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-2xl border bg-white backdrop-blur-md shadow-lg text-xs font-medium ${styles[type]||styles.info}`;
      t.style.background = isDarkMode ? '#1e293b' : '#fff';
      t.style.color = isDarkMode ? '#f1f5f9' : '#0f172a';
      t.innerHTML = `<i data-lucide="${icons[type]||'info'}" class="w-4 h-4 shrink-0"></i><span>${escapeHTML(msg)}</span>`;
      c.appendChild(t);
      lucide.createIcons({ root: t });
      setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3500);
    }
    function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
    function getInitials(n) { if(!n) return 'US'; const p=n.trim().split(/\s+/); return p.length===1?p[0].substring(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase(); }
    function getTime() { return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
    function userToEmail(u) { return `${u.trim().toLowerCase()}@chattop.local`; }
    function getGenderIcon(g) { const x=(g||'').toLowerCase(); if(x==='masculino')return'mars'; if(x==='feminino')return'venus'; return'user'; }

    // ===== DARK MODE =====
    function applyDark(dark) {
      isDarkMode = dark;
      document.body.classList.toggle('dark', dark);
      localStorage.setItem('chattop_dark', dark?'true':'false');
      document.querySelectorAll('.dark-icon').forEach(el => el.setAttribute('data-lucide', dark?'sun':'moon'));
      lucide.createIcons();
    }
    function toggleDarkMode() { applyDark(!isDarkMode); showToast(isDarkMode?'Modo escuro 🌙':'Modo claro ☀️','info'); }
    window.toggleDarkMode = toggleDarkMode;

    // ===== CAPTCHA =====
    function genCaptcha() {
      const ops=['+','-','×'], op=ops[Math.floor(Math.random()*3)];
      let a,b,ans;
      if(op==='+'){a=Math.floor(Math.random()*15)+2;b=Math.floor(Math.random()*15)+1;ans=a+b;}
      else if(op==='-'){a=Math.floor(Math.random()*15)+8;b=Math.floor(Math.random()*(a-1))+1;ans=a-b;}
      else{a=Math.floor(Math.random()*7)+2;b=Math.floor(Math.random()*6)+2;ans=a*b;}
      currentCaptchaResult=ans;
      document.getElementById('captcha-question').textContent = `Quanto é ${a} ${op} ${b}?`;
      document.getElementById('captcha-answer').value='';
    }
    document.getElementById('refresh-captcha').addEventListener('click', genCaptcha);

    // ===== AUTH TABS =====
    function switchAuthTab(mode) {
      currentAuthMode=mode;
      const tl=document.getElementById('tab-login'), tr=document.getElementById('tab-register'), st=document.getElementById('auth-submit-text');
      if(mode==='login'){ tl.className='py-2.5 text-sm font-semibold rounded-xl transition-all theme-gradient-bg shadow-sm'; tr.className='py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-500'; st.textContent='Entrar no Chat'; }
      else { tr.className='py-2.5 text-sm font-semibold rounded-xl transition-all theme-gradient-bg shadow-sm'; tl.className='py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-500'; st.textContent='Criar Conta e Entrar'; }
      genCaptcha();
    }
    window.switchAuthTab = switchAuthTab;

    // ===== AUTH SUBMIT =====
    document.getElementById('auth-form').addEventListener('submit', async e => {
      e.preventDefault();
      const u=document.getElementById('username').value.trim();
      const p=document.getElementById('password').value;
      const a=parseInt(document.getElementById('age').value,10);
      const g=document.getElementById('gender').value;
      const c=parseInt(document.getElementById('captcha-answer').value,10);
      const btn=document.getElementById('auth-submit-btn');

      if(u.length<3||!/^[a-zA-Z0-9_.]+$/.test(u)){showToast('Usuário inválido (mín. 3, só letras/números/._)','error');return;}
      if(p.length<6){showToast('Senha deve ter 6+ caracteres','error');return;}
      if(isNaN(a)||a<13||a>120){showToast('Idade inválida (13+)','error');return;}
      if(!g){showToast('Selecione o gênero','error');return;}
      if(c!==currentCaptchaResult){showToast('Captcha incorreto','error');genCaptcha();return;}

      btn.disabled=true; btn.style.opacity='.7';
      try {
        const email=userToEmail(u);
        if(currentAuthMode==='register'){
          const cred=await createUserWithEmailAndPassword(auth,email,p);
          await setDoc(doc(db,'users',cred.user.uid),{username:u,age:a,gender:g,createdAt:serverTimestamp()});
          showToast(`Bem-vindo(a), ${u}!`,'success');
        } else {
          const cred=await signInWithEmailAndPassword(auth,email,p);
          await setDoc(doc(db,'users',cred.user.uid),{username:u,age:a,gender:g},{merge:true});
          showToast(`Bem-vindo(a) de volta, ${u}!`,'success');
        }
      } catch(err) {
        console.error(err);
        let m='Erro ao autenticar.';
        if(err.code==='auth/email-already-in-use')m='Usuário já cadastrado.';
        else if(err.code==='auth/user-not-found')m='Usuário não encontrado.';
        else if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')m='Senha incorreta.';
        else if(err.code==='auth/weak-password')m='Senha fraca.';
        showToast(m,'error');
        genCaptcha();
      } finally { btn.disabled=false; btn.style.opacity='1'; }
    });

    // ===== LOGOUT =====
    async function logout() {
      try {
        stopPresence();
        if(unsubscribeMessages){unsubscribeMessages();unsubscribeMessages=null;}
        if(unsubscribePresence){unsubscribePresence();unsubscribePresence=null;}
        await signOut(auth);
        showToast('Você saiu.','info');
      } catch(e){ showToast('Erro ao sair.','error'); }
    }
    window.logout = logout;

    // ===== AUTH STATE =====
    onAuthStateChanged(auth, async user => {
      if(user){
        let profile={username:user.email.split('@')[0],age:18,gender:'Prefiro não informar'};
        try{ const s=await getDoc(doc(db,'users',user.uid)); if(s.exists()) profile={...profile,...s.data()}; }catch(e){}
        currentUser={uid:user.uid,...profile};
        enterChat();
        startPresence();
      } else {
        currentUser=null;
        stopPresence();
        if(unsubscribeMessages){unsubscribeMessages();unsubscribeMessages=null;}
        if(unsubscribePresence){unsubscribePresence();unsubscribePresence=null;}
        document.getElementById('chat-screen').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('password').value='';
        genCaptcha();
      }
    });

    // ===== CHAT UI =====
    function enterChat() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('user-avatar').textContent=getInitials(currentUser.username);
      document.getElementById('profile-username').textContent=currentUser.username;
      document.getElementById('profile-info').textContent=`${currentUser.age} anos • ${currentUser.gender}`;
      renderChannels();
      selectChannel('geral');
      lucide.createIcons();
    }
    function toggleSidebar(open){
      const s=document.getElementById('sidebar'), b=document.getElementById('sidebar-backdrop');
      if(open){s.classList.remove('-translate-x-full');b.classList.remove('hidden');}
      else{s.classList.add('-translate-x-full');b.classList.add('hidden');}
    }
    window.toggleSidebar = toggleSidebar;

    function renderChannels() {
      const list=document.getElementById('channels-list');
      list.innerHTML='';
      CHANNELS.forEach(ch=>{
        const active=ch.id===activeChannelId;
        const btn=document.createElement('button');
        btn.type='button';
        btn.onclick=()=>{selectChannel(ch.id);toggleSidebar(false);};
        btn.className=`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm transition-all ${active?'font-semibold bg-white border border-slate-200':'text-slate-600 hover:bg-white/60 border border-transparent'}`;
        if(active){btn.style.background='var(--bg-card)';btn.style.borderColor='var(--border-color)';btn.style.color='var(--text-primary)';}
        btn.innerHTML=`<i data-lucide="${ch.icon}" class="w-4 h-4" style="${active?'color:var(--theme-accent)':'color:#94a3b8'}"></i><span class="truncate">${ch.name}</span>`;
        list.appendChild(btn);
      });
      lucide.createIcons({root:list});
    }

    function selectChannel(id) {
      activeChannelId=id;
      const ch=CHANNELS.find(c=>c.id===id)||CHANNELS[0];
      document.getElementById('current-channel-name').textContent=ch.name;
      document.getElementById('current-channel-desc').textContent=ch.desc;
      document.getElementById('current-channel-icon').setAttribute('data-lucide',ch.icon);
      renderChannels();
      lucide.createIcons();
      attachMessages(id);
    }

    // ===== MENSAGENS =====
    function attachMessages(channelId) {
      if(unsubscribeMessages){unsubscribeMessages();unsubscribeMessages=null;}
      const container=document.getElementById('messages-container');
      container.innerHTML='<div class="h-full flex items-center justify-center text-slate-400 text-sm">Carregando...</div>';
      const q=query(collection(db,'channels',channelId,'messages'),orderBy('createdAt','asc'),limit(200));
      unsubscribeMessages=onSnapshot(q, snap=>{
        const msgs=[];
        snap.forEach(d=>msgs.push({id:d.id,...d.data()}));
        renderMessages(msgs, container);
      }, err=>{
        console.error('Erro ao carregar mensagens:',err);
        container.innerHTML=`<div class="h-full flex flex-col items-center justify-center text-red-500 text-sm"><p>Erro ao carregar</p><p class="text-xs mt-1">${escapeHTML(err.message)}</p></div>`;
      });
    }

    function renderMessages(msgs, container) {
      if(msgs.length===0){
        container.innerHTML=`<div class="h-full flex flex-col items-center justify-center text-slate-400 text-sm"><i data-lucide="message-circle" class="w-10 h-10 mb-2 opacity-50"></i><p>Nenhuma mensagem ainda</p><p class="text-xs mt-1">Seja o primeiro a enviar!</p></div>`;
        lucide.createIcons({root:container});
        return;
      }
      container.innerHTML='';
      msgs.forEach(msg=>{
        const own = currentUser && (msg.senderId===currentUser.uid||msg.uid===currentUser.uid);
        const deleted = msg.deleted===true;
        const wrapper=document.createElement('div');
        wrapper.className=`msg-wrapper flex items-end gap-2 msg-anim ${own?'justify-end':'justify-start'}`;
        const bubbleClass = deleted?'bubble-received':(own?'bubble-sent':'bubble-received');
        const bubbleContent = deleted
          ? `<div class="${bubbleClass} px-4 py-2.5 text-sm italic opacity-60"><i data-lucide="trash-2" class="w-3 h-3 inline mr-1"></i>Mensagem removida</div>`
          : `<div class="${bubbleClass} px-4 py-2.5 text-sm break-words">${escapeHTML(msg.text)}</div>`;

        const deleteBtn = (own && !deleted)
          ? `<button type="button" class="msg-delete-btn mt-1 p-1 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 border border-red-200" title="Remover" onclick="deleteMsg('${msg.id}')"><i data-lucide="trash-2" class="w-3 h-3"></i></button>`
          : '';

        if(own){
          wrapper.innerHTML=`
            <div class="flex flex-col items-end max-w-[80%]">
              <div class="flex items-center gap-1.5 mb-1 px-1">
                <span class="text-[10px] text-slate-400">${escapeHTML(msg.time||'')}</span>
                <span class="text-xs font-semibold" style="color:var(--theme-accent)">Você</span>
              </div>
              ${bubbleContent}
              ${deleteBtn}
            </div>
            <div class="w-8 h-8 rounded-xl theme-gradient-bg flex items-center justify-center text-xs font-bold shrink-0">${getInitials(msg.sender)}</div>`;
        } else {
          wrapper.innerHTML=`
            <div class="w-8 h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xs font-bold shrink-0" style="background:var(--bg-card);border-color:var(--border-color);color:var(--text-primary)">${getInitials(msg.sender)}</div>
            <div class="flex flex-col items-start max-w-[80%]">
              <div class="flex flex-wrap items-center gap-1.5 mb-1 px-1">
                <span class="text-xs font-semibold" style="color:var(--text-primary)">${escapeHTML(msg.sender)}</span>
                <span class="inline-flex items-center gap-1 text-[10px] px-1.5 rounded-full bg-slate-100 border border-slate-200" style="background:var(--bg-slate-100,#f1f5f9);border-color:var(--border-color);color:var(--text-muted)" title="${escapeHTML(msg.gender||'')}">
                  <i data-lucide="${getGenderIcon(msg.gender)}" class="w-2.5 h-2.5"></i>${msg.age||''}
                </span>
                <span class="text-[10px] text-slate-400">${escapeHTML(msg.time||'')}</span>
              </div>
              ${bubbleContent}
            </div>`;
        }
        container.appendChild(wrapper);
      });
      lucide.createIcons({root:container});
      container.scrollTop=container.scrollHeight;
    }

    // ===== DELETAR =====
    async function deleteMsg(id) {
      if(!confirm('Remover esta mensagem?'))return;
      try{
        await updateDoc(doc(db,'channels',activeChannelId,'messages',id),{deleted:true,text:'',deletedAt:serverTimestamp()});
        showToast('Mensagem removida.','info');
      }catch(e){ showToast('Erro: '+e.message,'error'); }
    }
    window.deleteMsg = deleteMsg;

    // ===== ENVIAR =====
    document.getElementById('message-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const input=document.getElementById('message-input');
      const text=input.value.trim();
      if(!text||!currentUser)return;
      input.value='';
      try{
        await addDoc(collection(db,'channels',activeChannelId,'messages'),{
          uid:currentUser.uid, senderId:currentUser.uid,
          sender:currentUser.username, age:currentUser.age, gender:currentUser.gender,
          text, time:getTime(), createdAt:serverTimestamp(), deleted:false
        });
      }catch(err){ console.error(err); showToast('Falha ao enviar: '+err.message,'error'); }
    });

    // ===== PRESENÇA =====
    function startPresence() {
      if(!currentUser)return;
      stopPresence();
      const ref=doc(db,'presence',currentUser.uid);
      const write=()=>setDoc(ref,{uid:currentUser.uid,username:currentUser.username,lastSeen:serverTimestamp()},{merge:true}).catch(()=>{});
      write();
      presenceHeartbeat=setInterval(write,25000);
      unsubscribePresence=onSnapshot(collection(db,'presence'),snap=>{
        const now=Date.now(); const alive=[];
        snap.forEach(d=>{
          const data=d.data();
          let ms=0; if(data.lastSeen&&typeof data.lastSeen.toMillis==='function') ms=data.lastSeen.toMillis();
          if(now-ms<90000) alive.push({uid:d.id,username:data.username||'Usuário'});
        });
        onlineCache=alive;
        renderOnline(alive);
      });
    }
    function stopPresence() {
      if(presenceHeartbeat){clearInterval(presenceHeartbeat);presenceHeartbeat=null;}
      if(unsubscribePresence){unsubscribePresence();unsubscribePresence=null;}
      if(currentUser) deleteDoc(doc(db,'presence',currentUser.uid)).catch(()=>{});
    }
    function renderOnline(users) {
      document.getElementById('online-count-sidebar').textContent=users.length;
      const list=document.getElementById('online-users-list');
      list.innerHTML='';
      const sorted=[...users].sort((a,b)=>{if(a.uid===currentUser.uid)return-1;if(b.uid===currentUser.uid)return 1;return a.username.localeCompare(b.username);});
      sorted.forEach(u=>{
        const me=u.uid===currentUser.uid;
        const li=document.createElement('li');
        li.className='flex items-center gap-2 px-2 py-1.5 rounded-xl';
        li.innerHTML=`<div class="w-7 h-7 rounded-lg bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-[10px] font-bold text-white shrink-0">${getInitials(u.username)}</div><p class="text-xs truncate flex-1" style="color:var(--text-primary)">${escapeHTML(u.username)}${me?' (Você)':''}</p><span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>`;
        list.appendChild(li);
      });
    }

    // ===== INIT =====
    window.addEventListener('DOMContentLoaded',()=>{
      applyDark(isDarkMode);
      genCaptcha();
      lucide.createIcons();
    });
  </script>
</body>
</html>
